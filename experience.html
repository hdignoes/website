<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experience — Hugo Dignoes Ricart</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ── current badge ── */
    .badge-current {
      display: inline-block;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      padding: .18rem .6rem;
      border-radius: 20px;
      background: #e8f8f5;
      color: #0e7a65;
      border: 1px solid #a2d9ce;
      margin-left: .5rem;
      vertical-align: middle;
    }

    /* ── tabs ── */
    .tab-bar {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 2rem;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      padding: .65rem 1.4rem;
      font-size: .95rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: color .18s, border-color .18s;
      letter-spacing: .01em;
    }
    .tab-btn.active {
      color: var(--teal);
      border-bottom-color: var(--teal);
    }
    .tab-btn:hover:not(.active) {
      color: var(--navy);
    }

    /* ── panes ── */
    .tab-pane          { display: none; }
    .tab-pane.active   { display: block; }
  </style>
</head>
<body>

<!-- ── NAV ──────────────────────────────────────────────────────── -->
<nav>
  <div class="nav-inner">
    <a href="index.html" style="text-decoration:none">
      <div class="nav-brand">
        <span class="nav-brand-name">Hugo Dignoes Ricart</span>
        <span class="nav-brand-role">PhD Student · Mechanical Engineering · UBC</span>
      </div>
    </a>
    <ul class="nav-menu">
      <li><a href="index.html">About</a></li>
      <li><a href="experience.html" class="active">Experience</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</nav>

<!-- ── PAGE HEADER ───────────────────────────────────────────────── -->
<header class="page-header">
  <div class="container">
    <h1><i class="fa-solid fa-briefcase" style="margin-right:.6rem;opacity:.7"></i>Experience</h1>
    <p class="subtitle">
      An assortment of academic research experience, collaboration with NGOs, and more boats than you'd have thunk!
    </p>
  </div>
</header>

<!-- ── TIMELINE ──────────────────────────────────────────────────── -->
<section class="section" style="background: var(--bg);">
  <div class="container">

    <!-- tab buttons -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="research">Research &amp; Academic</button>
      <button class="tab-btn"        data-tab="leadership">Leadership &amp; Volunteer</button>
    </div>

    <!-- tab panes — populated by render script -->
    <div class="tab-pane active" id="tab-research">
      <div class="timeline" id="timeline-research"></div>
    </div>
    <div class="tab-pane" id="tab-leadership">
      <div class="timeline" id="timeline-leadership"></div>
    </div>

  </div>
</section>

<!-- ── FOOTER ────────────────────────────────────────────────────── -->
<footer id="site-footer"></footer>

<!-- ── CONTENT DATA ──────────────────────────────────────────────── -->
<script src="content/profile.js?v=2"></script>
<script src="content/experience.js?v=2"></script>

<!-- ── RENDER ────────────────────────────────────────────────────── -->
<script>
(function () {
  // ── Render a single timeline item ──────────────────────────────
  const renderItem = e => {
    const isCurrent   = e.dateEnd === null;
    const dateDisplay = isCurrent ? `${e.dateStart} – Present` : `${e.dateStart} – ${e.dateEnd}`;
    const companyLink = e.companyUrl
      ? `<a href="${e.companyUrl}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square" style="font-size:.75em;margin-right:.3rem"></i>${e.company}</a>`
      : `<span>${e.company}</span>`;
    return `
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-card">
          <div class="timeline-header">
            <div>
              <span class="timeline-title">${e.title}</span>
              ${isCurrent ? '<span class="badge-current">Current</span>' : ''}
            </div>
            <span class="timeline-date">${dateDisplay}</span>
          </div>
          <div class="timeline-company">${companyLink}</div>
          ${e.location ? `<div class="timeline-location"><i class="fa-solid fa-location-dot"></i>${e.location}</div>` : ''}
          <div class="timeline-desc">
            <ul>${e.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
          </div>
        </div>
      </div>`;
  };

  // ── Populate each tab pane ─────────────────────────────────────
  ['research', 'leadership'].forEach(g => {
    const all    = EXPERIENCE.filter(e => e.group === g);
    const sorted = [...all.filter(e => e.dateEnd === null), ...all.filter(e => e.dateEnd !== null)];
    document.getElementById('timeline-' + g).innerHTML = sorted.map(renderItem).join('');
  });

  // ── Tab switching ──────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ── Footer ─────────────────────────────────────────────────────
  document.getElementById('site-footer').innerHTML =
    `<p>&copy; ${new Date().getFullYear()} ${PROFILE.name} &nbsp;·&nbsp; ${PROFILE.location} &nbsp;·&nbsp;
      <a href="mailto:${PROFILE.email}">${PROFILE.email}</a></p>`;
})();
</script>

</body>
</html>
